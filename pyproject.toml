[project]
name = "text-tabular-nlp"
version = "0.1.0"
description = "Technion 097215 NLP final project: text-tabular prediction on MulTaBench (built on MulTaBench @ paper_version)"
readme = "README.md"
requires-python = "==3.11.*"
# Direct dependencies = upstream requirements.in (sap-rpt-oss pinned to the commit upstream's requirements.txt resolved).
dependencies = [
    "catboost",
    "datasets",
    "gpustat ; platform_system == 'Linux'",
    "joblib",
    "kaggle>=2.0.1",
    "kagglehub >= 1.0.0",
    "lightgbm",
    "numpy",
    "openml",
    "pandas >= 2.2.2",
    "peft",
    "pytabkit",
    "pytest",
    "python-dotenv",
    "sap-rpt-oss @ git+https://github.com/SAP-samples/sap-rpt-1-oss@4310453f3bbb9c9c403b029e966565e7fe652d97",
    "scikit-learn",
    "sentence_transformers",
    "setuptools < 82",
    "scipy",
    "skrub",
    "streamlit",
    "tabdpt >= 1.1.9",
    "tabicl>=2.0.3",
    "autogluon.multimodal",
    "tabpfn >= 7.1.1",
    "tabstar >= 1.1.15",
    "torch >= 2.6.0",
    "torchvision",
    "tqdm",
    "transformers >= 4.49.0",
    "xgboost",
    "wandb",
]

[dependency-groups]
# Only needed for notebooks/ (not for running benchmark.py).
dev = [
    "ipykernel",
    "nbclient",
    "nbformat",
]

[tool.uv]
package = false
# Lock only for Linux (laptop WSL + Colab), matching upstream's requirements.txt.
environments = ["sys_platform == 'linux'"]
# Keep every runtime version identical to upstream's requirements.txt (uv pip compile output).
